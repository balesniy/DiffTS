services:
  diffts:
    build:
      context: .
      dockerfile: Dockerfile.cuda128
      ssh: ["default"]
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: diffts:cuda128
    gpus: all
    shm_size: "128gb"
    stdin_open: true
    tty: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/docker_logs:/var/log
      - .:/packages/DiffTS
      - ./logs:/logs
      # - PATH_TO_FOLDER_CONTAINING_DATASETS:/data
    environment:
      - DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu, compute, utility, graphics]

  diffts-legacy:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.legacy
      ssh: ["default"]
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: diffts:legacy-cu117
    runtime: nvidia
    shm_size: "128gb"
    stdin_open: true
    tty: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/docker_logs:/var/log
      - .:/packages/DiffTS
      - ./logs:/logs
      # - PATH_TO_FOLDER_CONTAINING_DATASETS:/data
    environment:
      - DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
