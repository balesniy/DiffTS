data:
  dataset_norm: false
  max_range: 200.0
  num_nodes: 3000
  num_points: 100000 # "auto"
  preload: false
  prune_length: 0.0
  prune_min_radius: 0.0
  cond_resolution: 0.001
  node_resolution: 0.005
  std_axis_norm: false
  scan_prune_dist: 0
  node_count_vox_size: 0.12
  debug_vis: false
  multiply_data: 50
  scan_farthps: false
  node_fps: false
  overfit: false
  remove_leaves: false
  lidar_sim: false
  vis_output: false
  pp_max_bridge_dist: 0.2
  connected_components_filt: false
  test_w_uncond: false
diff:
  beta_end: 2.0e-04
  beta_func: linear
  beta_start: 2.0e-06
  reg_weight: 5.0
  s_steps: 200
  t_steps: 1000
model:
  type: legacy
  out_dim: 96
  downscale_params: 1
  semantic_encoder: false
  debug: false
  overfit: false
  unet_encoder: false
  legacy_model: false
  multiscale_cond: false

topological:
  n_max: 3000
  latent_dim: 96
  semantic_channels: 3
  temporal_anchor: null

voxel:
  grid_size: [128, 128, 256]
  blur_sigma: 1.0
  bounds_padding: 0.05

graph:
  k: 12
  corridor_samples: 8
  sigma: 0.1
  tau: 0.25
  depth_margin: 0.05
  conf_threshold: 0.5
  use_two_cycle_loss: false

guidance:
  active_fraction: 0.2
  final_decay_fraction: 0.05
  max_displacement: 0.02
  base_eta: 1.0
  repel_weight: 0.0
  repel_radius: 0.005
  repel_k: 8

losses:
  eps: 1.0
  flow: 1.0
  conf: 1.0
  depth: 0.2
  edge: 1.0
  topology: 0.1
  pruning: 0.25

pruning:
  enabled: true
  hidden_dim: 128
  num_layers: 3
  threshold: 0.5
  max_intermediate: 3
  focal_alpha: 0.25
  focal_gamma: 2.0

train:
  batch_size: 4
  decay_lr: 0.0
  lr_decay_epochs: 75
  lr: 0.0001
  max_epoch: 10000
  n_gpus: -1
  neighb_fusion: wMean
  num_workers: 20
  rel_neighbs: normed_dir
  snr_weighting: false
  uncond_prob: 0.1
  uncond_w: 2.0
  input_feats: "colors"
  use_semantics: false
  use_colors: true
  cond_dist_limit: 0.0
  qsample_inference: true
